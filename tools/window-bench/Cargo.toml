[package]
name = "velocity-window-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[[bin]]
name = "native"
path = "native.rs"

[[bin]]
name = "winit"
path = "winit.rs"
required-features = ["winit"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
