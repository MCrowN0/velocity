[package]
name = "velocity"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
ash-window = "0.13"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
image = { version = "0.25.10", features = ["avif"] }

[build-dependencies]
naga = { version = "0.19", features = ["wgsl-in", "spv-out"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
